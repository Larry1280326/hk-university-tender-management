[project]
name = "hkust-workflow"
version = "0.1.0"
description = "HKUST e-Tendering Portal Automation & Gmail Drafter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Local web UI only; Streamlit Community Cloud installs web/requirements.txt instead.
web = [
    "streamlit>=1.37,<2",
    "streamlit-authenticator>=0.3.2,<0.5",
]
